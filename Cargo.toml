[package]
name = "gossipsub-baseline-bench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Disclosed-baseline benchmark harness for stock rust-libp2p gossipsub at 4-10 MB message sizes"

[dependencies]
comp-cat-rs = { path = "../comp-cat-rs" }
libp2p-core = { git = "https://github.com/libp2p/rust-libp2p", rev = "ee8bf12e6d94d48518ea67773abb11625b2c4f41" }
libp2p-identity = { version = "0.3.0", features = ["ed25519", "rand", "peerid"] }
libp2p-swarm = { git = "https://github.com/libp2p/rust-libp2p", rev = "ee8bf12e6d94d48518ea67773abb11625b2c4f41", features = ["tokio"] }
libp2p-gossipsub = { git = "https://github.com/libp2p/rust-libp2p", rev = "ee8bf12e6d94d48518ea67773abb11625b2c4f41" }
libp2p-plaintext = { git = "https://github.com/libp2p/rust-libp2p", rev = "ee8bf12e6d94d48518ea67773abb11625b2c4f41" }
libp2p-yamux = { git = "https://github.com/libp2p/rust-libp2p", rev = "ee8bf12e6d94d48518ea67773abb11625b2c4f41" }
futures = "0.3"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
